<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Claude Cursor Codex Token Saver Kit banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="48" y="48" width="1184" height="544" rx="28" fill="none" stroke="#1f2a44" stroke-width="2"/>
  <circle cx="1120" cy="120" r="120" fill="#22d3ee" opacity="0.08"/>
  <circle cx="180" cy="520" r="160" fill="#34d399" opacity="0.07"/>

  <text x="96" y="150" fill="#e5eefc" font-family="Arial, sans-serif" font-size="54" font-weight="700">Claude Cursor Codex</text>
  <text x="96" y="220" fill="url(#accent)" font-family="Arial, sans-serif" font-size="54" font-weight="700">Token Saver Kit</text>
  <text x="96" y="280" fill="#9fb0d0" font-family="Arial, sans-serif" font-size="28" font-weight="500">Cut shell, context, and output token waste by 50-70%</text>

  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="96" y="330" width="120" height="48" rx="24" fill="#12352b" stroke="#34d399"/>
    <text x="156" y="361" fill="#86efac" text-anchor="middle">RTK</text>
    <rect x="232" y="330" width="220" height="48" rx="24" fill="#241a3d" stroke="#a78bfa"/>
    <text x="342" y="361" fill="#d8b4fe" text-anchor="middle">Token Optimizer</text>
    <rect x="468" y="330" width="150" height="48" rx="24" fill="#3a2412" stroke="#fb923c"/>
    <text x="543" y="361" fill="#fdba74" text-anchor="middle">Caveman</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="96" y="410" width="120" height="42" rx="21" fill="#162033" stroke="#334155"/>
    <text x="156" y="437" fill="#cbd5e1" text-anchor="middle">Cursor</text>
    <rect x="228" y="410" width="170" height="42" rx="21" fill="#162033" stroke="#334155"/>
    <text x="313" y="437" fill="#cbd5e1" text-anchor="middle">Claude Code</text>
    <rect x="410" y="410" width="100" height="42" rx="21" fill="#162033" stroke="#334155"/>
    <text x="460" y="437" fill="#cbd5e1" text-anchor="middle">Codex</text>
  </g>

  <g filter="url(#glow)">
    <rect x="860" y="120" width="300" height="300" rx="150" fill="none" stroke="#22d3ee" stroke-width="10" opacity="0.35"/>
    <text x="1010" y="235" fill="#f8fafc" font-family="Arial, sans-serif" font-size="64" font-weight="700" text-anchor="middle">68%</text>
    <text x="1010" y="280" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle">shell savings</text>
    <text x="1010" y="340" fill="#34d399" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">16.7M</text>
    <text x="1010" y="375" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">tokens saved</text>
  </g>

  <text x="96" y="560" fill="#64748b" font-family="Arial, sans-serif" font-size="18">Free open-source installer | github.com/BOZXYZ/Claude-Cursor-Codex-Token-Saver-Kit</text>
</svg>
